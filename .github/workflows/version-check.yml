name: Version check

# Refuse a change whose next version would disagree with what the change did
# to this package's public API.
#
# Stado owns the whole check: `stado product surface` builds the library at
# the tag consumers resolve and at this revision, reads both public surfaces
# with the toolchain's own `swift api-digester`, and refuses when the version
# this revision declares does not match the change the digester names. This
# repository supplies only what it alone knows: its sources, its tags and the
# version in version.json, which `.wisent-release.json` names as the release
# version and which becomes the next tag.
#
# Why this package declares a version at all when Package.swift carries no
# version line: SwiftPM selects a version by git tag, and every sibling
# package resolving `from:` keeps getting the released tag while this
# package's surface moves. The check never bumps and never tags.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: [self-hosted, macOS, stado]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request checks out a synthetic merge commit by default. A
          # release tag can only point at the candidate commit, so inspect it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # actions/checkout fetches one commit and no tags. The check reads the
      # released tag's tree with `git archive` and the tags pointing at this
      # revision, so both must be present. Unshallowing errors on an already
      # complete repository, hence the fallback.
      - name: Make tags and history visible
        run: git fetch --force --tags --unshallow || git fetch --force --tags

      - name: Compare the public API against the released tag
        run: stado product surface --package-path . --json
