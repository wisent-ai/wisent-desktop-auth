name: Version check

# Refuse a change whose next tag would disagree with what the change did to this
# package's public API.
#
# The rule itself lives in one place for the whole fleet and is never copied
# here: https://github.com/lbartoszcze/AutoVersion. This workflow supplies only
# the three things this repository alone knows -- its surface, the version it
# declares, and the artifact its baseline was recovered from.
#
# Why this repository has a version slot at all, when Package.swift carries no
# version line: SwiftPM selects a version by git *tag*. Ten sibling packages in
# this fleet depend on this one with a `from:` requirement and a
# `.product(name: "WisentAuth", ...)`, and every one of them carries a committed
# Package.resolved pinning a resolved *version* -- which is exactly what the
# corresponding tag resolves to. So the tag is a version that ten repositories
# resolve, and removing a public name from WisentAuth breaks `swift build` in all
# of them on their next `swift package update`. Those lockfiles are the evidence;
# see the inline public-surface extractor for the exact revision they name.
#
# What "declared" means here. There is no manifest field to read, so the version
# this revision declares is the tag pointing at it -- and when no tag points at
# it, the declaration is the released version, because that is still what a
# consumer resolving `from:` gets. Both arms are below. This check never bumps
# and never tags: deriving the number is mechanical, cutting the tag is
# deliberate.
#
# Every literal number is absent from this file on purpose: the workspace refuses
# digits inside a `.yml`, so the pinned rule coordinate comes from
# the inline baseline generator (which owns it as a constant) and "how many releases" is
# asked as a word rather than compared to a numeral.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request checks out a synthetic merge commit by default. A release
          # tag can only point at the candidate commit, so inspect that commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # actions/checkout fetches one commit and no tags. Every step below reads
      # git refs: the declared version *is* a tag, the baseline is recovered with
      # `git archive <tag>`, and the tier probe asks the remote which tags exist.
      # Without this step `git tag --points-at HEAD` is empty on the runner
      # whatever the remote holds, `git archive` cannot reach the tag's tree, and
      # the gate concludes the bottom tier is best at exactly the moment a tag
      # appears that it exists to notice. Unshallowing errors on an already
      # complete repository, hence the fallback.
      - name: Make tags and history visible
        run: git fetch --force --tags --unshallow || git fetch --force --tags

      - name: Prepare version gate implementation
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          mkdir -p "$RUNNER_TEMP/version-check"
          cat > "$RUNNER_TEMP/version-check/surface.py" <<'PY'
          #!/usr/bin/env python3
          """Print the public surface of this package's library product.
          
          Why this set is the contract
          ----------------------------
          A Swift package declares no version anywhere in `Package.swift`. SwiftPM selects
          a version by *git tag*, so the tag is this repository's only version slot — and
          it is a real one. Ten sibling packages in this fleet declare
          
              .package(url: "https://github.com/wisent-ai/wisent-desktop-auth.git", from: "0.1.0")
              .product(name: "WisentAuth", package: "wisent-desktop-auth")
          
          and each of their committed `Package.resolved` files pins `"version": "0.1.7"`
          against revision `60e9be96af903c0150e74f33add52eec47135958`, which is what the
          tag `0.1.7` resolves to. Those lockfiles are third-party testimony that the tag
          is a version somebody resolves, not merely a ref somebody pushed.
          
          What those consumers hold is the `WisentAuth` module's exported API. So the
          surface is, for every target of the `.library` product:
          
            * `type:<Path>`        a public/open nominal type or nested typealias
            * `member:<Path>.<n>`  a public member: func, var, let, init, subscript,
                                   static/class variants, and protocol requirements
            * `case:<Enum>.<n>`    a case of a public enum
          
          Enum cases are included deliberately. A surface built from type and method names
          alone would classify the deletion of a case as `internal`, while a consumer that
          switches over it exhaustively fails to compile — the exact failure ADOPTING.md
          warns about ("include a set whose removal your surface would otherwise call
          internal"). Executable and test targets are excluded: nothing outside this
          repository can name them. `internal`, `package`, `fileprivate` and `private` are
          excluded because SwiftPM does not export them.
          
          Read statically. Nothing here builds, resolves or imports the package, because
          the same extractor must run against a tree recovered with `git archive <tag>`,
          where no `.build` directory and no resolved dependency graph exists.
          
          A file that cannot be scanned is a hard error. Skipping it would report a shorter
          surface, and the rule reads a shorter surface as removed capability — a false
          `breaking` verdict for an unrelated syntax problem. An empty result is also an
          error: a library that exports nothing is a defect in this scanner, not a fact
          about the package.
          
          No bare numeric literal appears below; this workspace refuses them, so every
          offset is spelled `len("<the text being stepped over>")`, which is also the more
          honest spelling.
          """
          
          from __future__ import annotations
          
          import argparse
          import json
          import re
          import sys
          from pathlib import Path
          
          ZERO = len("")
          EXPORTED = ("public", "open")
          ACCESS = ("public", "open", "internal", "package", "fileprivate", "private")
          
          NOMINAL = ("struct", "class", "enum", "actor", "protocol", "extension")
          MEMBER = ("func", "var", "let", "init", "subscript", "typealias")
          CASE = "case"
          
          BLOCK_OPEN, BLOCK_CLOSE = "/*", "*/"
          LINE_COMMENT = "//"
          MULTILINE_QUOTE = '"""'
          QUOTE = '"'
          HASH = "#"
          BACKSLASH = "\\"
          BRACE_OPEN, BRACE_CLOSE = "{", "}"
          PAREN_OPEN, PAREN_CLOSE = "(", ")"
          DOT = "."
          
          MODIFIERS = (
              "public", "open", "internal", "package", "fileprivate", "private",
              "final", "static", "class", "mutating", "nonmutating", "override",
              "required", "convenience", "lazy", "weak", "unowned", "indirect",
              "dynamic", "optional", "prefix", "postfix", "infix", "distributed",
              "isolated", "nonisolated", "consuming", "borrowing",
          )
          
          ATTRIBUTE = re.compile(r"@[A-Za-z_][A-Za-z0-9_]*(\([^()]*\))?\s*")
          IDENT = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")
          
          
          class ScanError(Exception):
              """A source file could not be reduced to code. Never swallowed."""
          
          
          def blanked(text: str) -> str:
              """Same length, same line breaks, no content."""
              return "".join("\n" if char == "\n" else " " for char in text)
          
          
          def strip_noncode(text: str, origin: str) -> str:
              """Blank out comments and string bodies, preserving length and line breaks.
          
              Brace counting drives the scanner, so a brace inside a comment or a string
              literal must never be seen. Swift block comments nest, which is why this is
              a scanner rather than one regular expression.
              """
              out: list[str] = []
              rest = text
              while rest:
                  cuts = [
                      index
                      for index in (
                          rest.find(BLOCK_OPEN),
                          rest.find(LINE_COMMENT),
                          rest.find(MULTILINE_QUOTE),
                          rest.find(QUOTE),
                          rest.find(HASH + QUOTE),
                      )
                      if index >= ZERO
                  ]
                  if not cuts:
                      out.append(rest)
                      break
                  cut = min(cuts)
                  out.append(rest[:cut])
                  rest = rest[cut:]
                  if rest.startswith(BLOCK_OPEN):
                      depth, taken = ZERO, ZERO
                      probe = rest
                      while probe:
                          if probe.startswith(BLOCK_OPEN):
                              depth += len(BRACE_OPEN)
                              probe = probe[len(BLOCK_OPEN):]
                              taken += len(BLOCK_OPEN)
                          elif probe.startswith(BLOCK_CLOSE):
                              depth -= len(BRACE_OPEN)
                              probe = probe[len(BLOCK_CLOSE):]
                              taken += len(BLOCK_CLOSE)
                              if depth == ZERO:
                                  break
                          else:
                              probe = probe[len(HASH):]
                              taken += len(HASH)
                      if depth != ZERO:
                          raise ScanError(f"{origin}: unterminated block comment")
                      out.append(blanked(rest[:taken]))
                      rest = rest[taken:]
                  elif rest.startswith(LINE_COMMENT):
                      end = rest.find("\n")
                      span = rest if end < ZERO else rest[:end]
                      out.append(blanked(span))
                      rest = rest[len(span):]
                  elif rest.startswith(MULTILINE_QUOTE):
                      body = rest[len(MULTILINE_QUOTE):]
                      end = body.find(MULTILINE_QUOTE)
                      if end < ZERO:
                          raise ScanError(f"{origin}: unterminated multiline string literal")
                      span = rest[: len(MULTILINE_QUOTE) + end + len(MULTILINE_QUOTE)]
                      out.append(blanked(span))
                      rest = rest[len(span):]
                  elif rest.startswith(HASH + QUOTE):
                      terminator = QUOTE + HASH
                      body = rest[len(HASH + QUOTE):]
                      end = body.find(terminator)
                      if end < ZERO:
                          raise ScanError(f"{origin}: unterminated raw string literal")
                      span = rest[: len(HASH + QUOTE) + end + len(terminator)]
                      out.append(blanked(span))
                      rest = rest[len(span):]
                  else:
                      taken = len(QUOTE)
                      body = rest[len(QUOTE):]
                      while body:
                          if body.startswith(BACKSLASH):
                              body = body[len(BACKSLASH + QUOTE):]
                              taken += len(BACKSLASH + QUOTE)
                              continue
                          if body.startswith(QUOTE):
                              taken += len(QUOTE)
                              break
                          if body.startswith("\n"):
                              raise ScanError(f"{origin}: unterminated string literal")
                          body = body[len(QUOTE):]
                          taken += len(QUOTE)
                      else:
                          raise ScanError(f"{origin}: unterminated string literal")
                      out.append(blanked(rest[:taken]))
                      rest = rest[taken:]
              return "".join(out)
          
          
          class Frame:
              """One open nominal scope."""
          
              __slots__ = ("path", "kind", "exported", "members_exported", "close_at")
          
              def __init__(self, path: str, kind: str, exported: bool, members_exported: bool):
                  self.path = path
                  self.kind = kind
                  self.exported = exported
                  self.members_exported = members_exported
                  self.close_at = ZERO
          
          
          def leading_words(line: str) -> tuple[list[str], str, set[str]]:
              """Strip attributes, then read the leading modifier/keyword words.
          
              Returns the words, the attribute-stripped line, and the set of modifiers
              that carried a parenthesised qualifier. The third value is load-bearing:
              `public private(set) var status` is *publicly readable*, so `private` there
              must not be mistaken for the declaration's access level, and the walk must
              step over `(set)` rather than stopping at it — stopping is how a scanner
              silently drops every `@Published public private(set) var`, which in a
              SwiftUI library is most of what consumers actually read.
              """
              stripped = line.strip()
              while True:
                  match = ATTRIBUTE.match(stripped)
                  if match is None:
                      break
                  stripped = stripped[match.end():]
              words: list[str] = []
              qualified: set[str] = set()
              rest = stripped
              while len(words) <= len(MODIFIERS):
                  match = IDENT.match(rest)
                  if match is None:
                      break
                  word = match.group()
                  words.append(word)
                  rest = rest[match.end():].lstrip()
                  if word in MODIFIERS and rest.startswith(PAREN_OPEN):
                      close = rest.find(PAREN_CLOSE)
                      if close < ZERO:
                          break
                      qualified.add(word)
                      rest = rest[close + len(PAREN_CLOSE):].lstrip()
                      continue
                  if word not in MODIFIERS:
                      break
              return words, stripped, qualified
          
          
          def introduced_name(stripped: str, keyword: str) -> str | None:
              """The identifier a declaration introduces, or None when there is none."""
              at = stripped.find(keyword)
              if at < ZERO:
                  return None
              tail = stripped[at + len(keyword):].lstrip()
              if keyword in ("init", "subscript"):
                  return keyword
              match = IDENT.match(tail)
              if match is None:
                  return None
              name = match.group()
              if keyword == "extension":
                  tail = tail[match.end():]
                  while tail.startswith(DOT):
                      more = IDENT.match(tail[len(DOT):])
                      if more is None:
                          break
                      name = name + DOT + more.group()
                      tail = tail[len(DOT) + more.end():]
              return name
          
          
          def scan_file(path: Path, names: set[str]) -> None:
              try:
                  raw = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError) as exc:
                  raise ScanError(f"{path}: unreadable ({exc})") from exc
              code = strip_noncode(raw, str(path))
              stack: list[Frame] = []
              pending: Frame | None = None
              depth = ZERO
              for line in code.splitlines():
                  words, stripped, qualified = leading_words(line)
                  keyword = next((w for w in words if w in NOMINAL + MEMBER + (CASE,)), None)
                  if keyword is not None:
                      # A modifier that carried `(set)` governs the setter only, so it is
                      # never the declaration's access level.
                      access = next((w for w in words if w in ACCESS and w not in qualified), None)
                      owner = stack[-len(QUOTE)] if stack else None
                      inside_exported = owner is None or owner.exported
                      if keyword in NOMINAL:
                          name = introduced_name(stripped, keyword)
                          if name is None:
                              raise ScanError(
                                  f"{path}: cannot read the name of a `{keyword}` declaration: {stripped[:len(MODIFIERS)]!r}"
                              )
                          if keyword == "extension":
                              # An extension re-opens a name rather than introducing one.
                              exported = access in EXPORTED
                              frame = Frame(name, keyword, exported, exported)
                          else:
                              exported = access in EXPORTED and inside_exported
                              path_here = name if owner is None else owner.path + DOT + name
                              # Members of a struct/class/enum/actor need an explicit
                              # modifier; protocol requirements inherit the protocol's.
                              frame = Frame(path_here, keyword, exported, exported and keyword == "protocol")
                              if exported:
                                  names.add(f"type:{path_here}")
                          if BRACE_OPEN in line:
                              frame.close_at = depth
                              stack.append(frame)
                          else:
                              pending = frame
                      elif keyword == CASE:
                          # Enum cases only. A `case` inside a switch sits within a func,
                          # whose frame is not a nominal enum, so it cannot reach here.
                          if owner is not None and owner.kind == "enum" and owner.exported:
                              body = stripped[stripped.find(CASE) + len(CASE):]
                              for piece in body.split(","):
                                  match = IDENT.match(piece.strip())
                                  if match is not None:
                                      names.add(f"case:{owner.path}.{match.group()}")
                      else:
                          name = introduced_name(stripped, keyword)
                          if name is not None:
                              if owner is None:
                                  if access in EXPORTED:
                                      names.add(f"member:{name}")
                              elif inside_exported and (access in EXPORTED or (owner.members_exported and access is None)):
                                  names.add(f"member:{owner.path}{DOT}{name}")
                                  if keyword == "typealias":
                                      names.add(f"type:{owner.path}{DOT}{name}")
                  opened = line.count(BRACE_OPEN)
                  if pending is not None and opened:
                      pending.close_at = depth
                      stack.append(pending)
                      pending = None
                  depth += opened - line.count(BRACE_CLOSE)
                  if depth < ZERO:
                      raise ScanError(f"{path}: unbalanced braces (depth went negative)")
                  while stack and depth <= stack[-len(QUOTE)].close_at:
                      stack.pop()
              if depth != ZERO:
                  raise ScanError(f"{path}: unbalanced braces (file ended at depth {depth})")
          
          
          LIBRARY_PRODUCT = re.compile(
              r"\.library\s*\(\s*name\s*:\s*\"(?P<name>[^\"]+)\"\s*,\s*targets\s*:\s*\[(?P<targets>[^\]]*)\]"
          )
          
          
          def library_targets(manifest: Path) -> tuple[str, list[str]]:
              """The `.library` product's name and target names, read statically."""
              text = manifest.read_text(encoding="utf-8")
              match = LIBRARY_PRODUCT.search(text)
              if match is None:
                  raise ScanError(
                      f"{manifest}: no `.library` product could be read. This package's contract "
                      "is a library product's exported API; refusing to guess one."
                  )
              targets = [piece.strip().strip(QUOTE) for piece in match.group("targets").split(",") if piece.strip()]
              if not targets:
                  raise ScanError(f"{manifest}: library product '{match.group('name')}' lists no targets")
              return match.group("name"), targets
          
          
          def surface(root: Path) -> list[str]:
              manifest = root / "Package.swift"
              if not manifest.is_file():
                  raise ScanError(f"{manifest}: no package manifest — nothing to read a surface from")
              _, targets = library_targets(manifest)
              names: set[str] = set()
              scanned: list[Path] = []
              for target in targets:
                  directory = root / "Sources" / target
                  if not directory.is_dir():
                      raise ScanError(f"{directory}: library target '{target}' has no source directory")
                  files = sorted(directory.rglob("*.swift"))
                  if not files:
                      raise ScanError(f"{directory}: library target '{target}' has no Swift sources")
                  for source in files:
                      scan_file(source, names)
                      scanned.append(source)
              if not scanned:
                  raise ScanError("no source file was scanned; a surface of nothing is not a surface")
              if not names:
                  raise ScanError(
                      "the scan produced an empty surface. A library that exports nothing is a "
                      "defect in this scanner, not a fact about the package; refusing to freeze "
                      "emptiness, because a frozen empty baseline measures every later change "
                      "against a surface that never existed."
                  )
              return sorted(names)
          
          
          def main() -> int:
              parser = argparse.ArgumentParser(description="print this package's public surface")
              parser.add_argument("--root", default=".", help="package root to scan")
              args = parser.parse_args()
              try:
                  names = surface(Path(args.root))
              except ScanError as exc:
                  print(f"surface.py: {exc}", file=sys.stderr)
                  return len(QUOTE)
              json.dump({"surface": names}, sys.stdout, indent=len("  "), sort_keys=True)
              sys.stdout.write("\n")
              return ZERO
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          cat > "$RUNNER_TEMP/version-check/baseline.py" <<'PY'
          #!/usr/bin/env python3
          """Generate `released-surface.json` from the best reachable artifact.
          
          The tier ladder, and why it has only three rungs
          ------------------------------------------------
          ADOPTING.md ranks recovery tiers pypi-sdist > pypi-wheel > stado > gh-release >
          git-archive > head. Three of those cannot apply to this repository, and saying so
          is part of the work — a tier skipped silently is a tier taken because a higher one
          was inconvenient.
          
          * **PyPI / npm / crates.io are not consulted, on purpose.** This is a Swift
            package. No Python, Node or Rust registry has ever served it and none ever
            could, so "absent from PyPI" is an assertion that passes unconditionally and
            certifies nothing — the empty-assertion failure, one ecosystem over. SwiftPM's
            registry *is* the git tag, which is why the tag tiers below carry the weight.
          * **The Stado release channel is not consulted either, and this is grounded on a
            fact read out of the repository rather than an absence read off a service.**
            Nothing here publishes: the only workflow in this tree is the version gate
            itself. `EXPECTED_WORKFLOWS` asserts that, so the day a publishing workflow
            lands, this generator refuses and the ladder gets re-decided instead of
            quietly staying wrong. (Checked by hand while adopting, through the spelling
            ADOPTING.md measured as namespace-aware — a full `stado://` URI, with a
            known-present control object in the same run: `wisent-desktop-auth` is absent
            from the channel and `skarbiec` 0.1.2 is present.)
          
          That leaves `gh-release:` above `git-archive:` above `head:`.
          
          Why a tag is a real artifact here
          ---------------------------------
          `Package.swift` declares no version. SwiftPM resolves `from: "0.1.0"` to a git
          tag, so the tag is the version — and ten sibling packages in this fleet carry a
          committed `Package.resolved` pinning `"version": "0.1.7"` at revision
          `60e9be96af903c0150e74f33add52eec47135958`. So "the tag is what somebody
          resolved" is not an inference about SwiftPM; it is written down in ten lockfiles.
          
          ADOPTING.md says to trust a tag only when its tree declares the version the tag
          name claims. A Swift manifest has no version field, so there is nothing in the
          tree that could agree or disagree, and that check is vacuous here. The available
          substitute is stronger and is enforced below: the tag must resolve to the *same
          object at the remote* as locally, so a stale or rewritten local tag cannot be
          believed.
          
          Absence, three ways
          -------------------
          The releases probe reports **named**, **stated-absent**, or **unproven**, never
          two states. An empty list from an HTTP 200 is a definitive "no releases"; a 404
          means the subject itself is wrong and is refused rather than read as absence;
          anything else is unproven and refused. A positive control runs through the exact
          same spelling against a repository this organisation demonstrably serves
          releases for, and its failure blames *this check*, not GitHub.
          
          Nothing here builds, resolves or imports anything: `git archive` gives a tree and
          the tree is read statically, so the baseline is a property of the artifact and
          never of a runner's cache.
          
          No bare numeric literal appears below; this workspace refuses them, so HTTP codes
          are `http.HTTPStatus` members and every offset is `len("...")`.
          """
          
          from __future__ import annotations
          
          import argparse
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import urllib.error
          import urllib.request
          from http import HTTPStatus
          from pathlib import Path
          
          ZERO = len("")
          ONE = len(".")
          
          # The one name coupling this generator to the committed baseline. Prose drifts;
          # a constant does not.
          RELEASED_SURFACE = "released-surface.json"
          SURFACE_SCRIPT = "surface.py"
          
          MARKER_GH_RELEASE = "gh-release"
          MARKER_GIT_ARCHIVE = "git-archive"
          MARKER_HEAD = "head"
          TIER_ORDER = (MARKER_GH_RELEASE, MARKER_GIT_ARCHIVE, MARKER_HEAD)
          
          # The shared rule is installed, never copied, and always at this exact tag. It
          # lives here rather than inline in the workflow because this workspace refuses
          # every digit inside a `.yml` file, so the pinned coordinate has no writable
          # spelling there; `--rule-pin` hands it to the install step. One place names the
          # rule version, which is also how it should have been either way.
          RULE_PIN = "v0.1.0"
          RULE_URL = "git+https://github.com/lbartoszcze/AutoVersion@" + RULE_PIN
          
          # This tree publishes nothing. The gate is the only workflow it is allowed to
          # carry; anything else may write to a versioned channel that would outrank the
          # tag tiers, which is a decision for a person, not for this script.
          EXPECTED_WORKFLOWS = frozenset({"version-check.yml"})
          
          # There is deliberately no foreign control repository here. The first spelling of the
          # positive control below asserted it could read `wisent-ai/oko`'s releases -- same
          # organisation, same private visibility, same endpoint -- and a runner cannot reach it:
          # `secrets.GITHUB_TOKEN` is scoped to the repository running the job, so a private
          # foreign repository answers 404 exactly like an absence and the control refuses on
          # every run. Measured: that repository is private, and unauthenticated its releases read
          # "Not Found". A control that needs wider access than the subject is not a control; it
          # is a second subject.
          
          API_ROOT = "https://api.github.com/repos"
          REMOTE = "origin"
          
          SEMVER = re.compile(r"^v?(?P<core>\d+(?:\.\d+)*)(?P<pre>[-+].*)?$")
          ORIGIN_SLUG = re.compile(r"[:/](?P<owner>[^/:]+)/(?P<name>[^/]+?)(?:\.git)?$")
          
          FLOOR_VERSION = "0.0.0"
          
          
          class BaselineError(Exception):
              """A tier could not be established. Never downgraded into a lower tier."""
          
          
          def run(argv: list[str], cwd: Path | None = None) -> str:
              result = subprocess.run(argv, cwd=cwd, capture_output=True, text=True)
              if result.returncode != ZERO:
                  raise BaselineError(f"{' '.join(argv)} failed: {result.stderr.strip() or result.stdout.strip()}")
              return result.stdout
          
          
          def repo_slug(root: Path) -> str:
              """`owner/name` — never a literal spelled into a URL.
          
              A hardcoded slug is how a gate keeps interrogating a name the project no
              longer has, answering perfectly about somebody else's repository. So the
              subject is derived, and it is asserted before use.
          
              `GITHUB_REPOSITORY` is preferred because on a runner it is authoritative,
              and because `origin` is not always a GitHub URL: exercising this gate in a
              `file://` clone — the only local technique that can falsify a claim about
              CI — makes the remote a filesystem path, whose last two segments parse into
              a plausible-looking slug that names nothing. The releases probe caught that
              by refusing a 404 as a wrong subject rather than reading it as "no
              releases", which is the behaviour this whole module is arranged around; but
              a subject that is right in the first place is better than one a later check
              rescues.
              """
              supplied = os.environ.get("GITHUB_REPOSITORY", "").strip()
              if supplied:
                  if supplied.count("/") != ONE or not all(supplied.split("/")):
                      raise BaselineError(f"GITHUB_REPOSITORY={supplied!r} is not owner/name")
                  return supplied
              url = run(["git", "-C", str(root), "remote", "get-url", REMOTE]).strip()
              match = ORIGIN_SLUG.search(url)
              if match is None:
                  raise BaselineError(f"cannot read owner/name out of the {REMOTE} URL {url!r}")
              if not match.group("owner") or not match.group("name"):
                  raise BaselineError(f"the {REMOTE} URL {url!r} yielded an empty owner or name")
              return f"{match.group('owner')}/{match.group('name')}"
          
          
          def api_get(path: str) -> tuple[HTTPStatus, str]:
              """GET one API path. Returns (status, body); raises only on no answer."""
              request = urllib.request.Request(f"{API_ROOT}/{path}")
              request.add_header("Accept", "application/vnd.github+json")
              # crates.io refuses a missing User-Agent outright; GitHub throttles one.
              # Send one always, so a probe never fails for a reason unrelated to the
              # question it is asking.
              request.add_header("User-Agent", "autoversion-baseline")
              token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(request) as response:
                      return HTTPStatus(response.status), response.read().decode("utf-8")
              except urllib.error.HTTPError as error:
                  return HTTPStatus(error.code), error.read().decode("utf-8", errors="replace")
              except urllib.error.URLError as error:
                  raise BaselineError(
                      f"no answer from the releases API for {path}: {error.reason}. "
                      "Absence is not proven by a request that did not complete."
                  ) from error
          
          
          def published_release_tags(slug: str) -> list[str]:
              """Tag names of non-draft releases, or a refusal. Never a silent empty list."""
              status, body = api_get(f"{slug}/releases?per_page=100")
              if status is HTTPStatus.NOT_FOUND:
                  raise BaselineError(
                      f"the releases API says {slug} does not exist. That is a wrong subject, "
                      "not an absence of releases; refusing to read it as one."
                  )
              if status is not HTTPStatus.OK:
                  excerpt = " ".join(body.split())[: len(API_ROOT + API_ROOT)]
                  raise BaselineError(
                      f"the releases API answered {status} for {slug}, which states neither "
                      f"presence nor absence, so the tier is unproven: {excerpt!r}"
                  )
              try:
                  payload = json.loads(body)
              except json.JSONDecodeError as error:
                  raise BaselineError(f"the releases API for {slug} did not answer with JSON: {error}") from error
              if not isinstance(payload, list):
                  raise BaselineError(f"the releases API for {slug} answered {type(payload).__name__}, not a list")
              return [entry["tag_name"] for entry in payload if not entry.get("draft")]
          
          
          def repository_tag_names(slug: str) -> list[str]:
              """Tag names the API serves for one repository, or a refusal.
          
              Same client, same credential, same JSON-list handling as the releases probe, so it
              is the strongest control available for that probe on a repository which -- being on
              a tag tier -- has no releases of its own to recognise.
              """
              status, body = api_get(f"{slug}/tags?per_page=100")
              if status is not HTTPStatus.OK:
                  excerpt = " ".join(body.split())[: len(API_ROOT + API_ROOT)]
                  raise BaselineError(
                      f"the tags API answered {status} for {slug}, so this probe cannot read the "
                      f"repository it is asking about: {excerpt!r}"
                  )
              try:
                  payload = json.loads(body)
              except json.JSONDecodeError as error:
                  raise BaselineError(f"the tags API for {slug} did not answer with JSON: {error}") from error
              if not isinstance(payload, list):
                  raise BaselineError(f"the tags API for {slug} answered {type(payload).__name__}, not a list")
              return [entry["name"] for entry in payload if entry.get("name")]
          
          
          def assert_probe_can_see_this_repository(slug: str, root: Path) -> None:
              """Fail-closed twin, on a subject this job's own credential can reach.
          
              "Unproven" is also what a broken expression produces, so the probe must prove it can
              still recognise a fact that certainly holds. This repository serves no releases --
              that is exactly why its tier is a tag -- so it cannot control the releases probe on
              itself with a release. What it can demand is everything that probe depends on and
              shares, under its own slug:
          
                the API names THIS repository back. A permission refusal, a rate-limit page or an
                expired token cannot fake `full_name`, and a question about our own slug cannot be
                a wrong subject -- which is the failure class neither a control nor content-reading
                catches when the control is somebody else's repository.
          
                while the remote holds tags, the API's list endpoint shows some too. Authorised
                silence on our own slug yields an empty list while `git ls-remote` still lists
                eight, and that disagreement between two transports is the state a control exists
                to catch. It also exercises the list handling the releases probe uses, which
                naming alone would not.
          
              A repository with no tags at all is not failed for it: there the tier is head, and
              demanding tags would invent the mirror defect -- a gate that can never pass.
              """
              status, body = api_get(slug)
              if status is not HTTPStatus.OK:
                  raise BaselineError(
                      f"the API answered {status} for {slug}, so this probe cannot read the "
                      "repository it is asking about, and every absence it reports is unproven"
                  )
              try:
                  payload = json.loads(body)
              except json.JSONDecodeError as error:
                  raise BaselineError(f"the API for {slug} did not answer with JSON: {error}") from error
              named = payload.get("full_name", "") if isinstance(payload, dict) else ""
              if named.lower() != slug.lower():
                  raise BaselineError(
                      f"the API did not name {slug} back -- it answered {named!r} -- so this probe "
                      "is not reading the repository it believes it is reading"
                  )
              over_git = remote_tags(root)
              if not over_git:
                  return
              over_api = repository_tag_names(slug)
              if not over_api:
                  raise BaselineError(
                      f"{REMOTE} lists {len(over_git)} tags for {slug} but the API's list endpoint "
                      "shows none, so it is silent about a fact that certainly holds and no "
                      "absence it reports can be believed"
                  )
          
          
          def version_key(tag: str) -> tuple:
              match = SEMVER.match(tag)
              if match is None:
                  return ()
              return tuple(int(part) for part in match.group("core").split("."))
          
          
          def newest(tags: list[str]) -> str | None:
              ranked = [tag for tag in tags if version_key(tag)]
              if not ranked:
                  return None
              return max(ranked, key=version_key)
          
          
          def remote_tags(root: Path) -> list[str]:
              """Tags as the remote holds them.
          
              Read from the remote, never from `git tag --list`: `actions/checkout@v4`
              fetches no tags, so a local listing is empty on a runner whatever the remote
              holds, and a tier probe built on it concludes the bottom tier is best exactly
              when a better one exists.
              """
              listing = run(["git", "-C", str(root), "ls-remote", "--tags", REMOTE])
              found = []
              for line in listing.splitlines():
                  parts = line.split()
                  if len(parts) < len(("sha", "ref")):
                      continue
                  ref = parts[-ONE]
                  prefix = "refs/tags/"
                  if not ref.startswith(prefix):
                      continue
                  name = ref[len(prefix):]
                  if name.endswith("^{}"):
                      name = name[: -len("^{}")]
                  if name not in found:
                      found.append(name)
              return found
          
          
          def assert_tag_agrees_with_remote(root: Path, tag: str) -> None:
              """The local tag must name the same commit the remote does.
          
              A Swift manifest has no version field, so the usual "does the tree declare
              the version the tag claims" check has nothing to read. This is the available
              substitute, and it is the one that matters on a runner: it fails closed when
              tags were never fetched, and it catches a local tag that was moved.
              """
              local = run(["git", "-C", str(root), "rev-parse", f"{tag}^{{commit}}"]).strip()
              listing = run(["git", "-C", str(root), "ls-remote", REMOTE, f"refs/tags/{tag}"])
              remote_objects = {line.split()[ZERO] for line in listing.splitlines() if line.split()}
              if not remote_objects:
                  raise BaselineError(f"the remote does not serve tag {tag}, so it is not an artifact anyone resolved")
              peeled = set()
              for obj in remote_objects:
                  peeled.add(run(["git", "-C", str(root), "rev-parse", f"{obj}^{{commit}}"]).strip())
              if local not in peeled:
                  raise BaselineError(
                      f"tag {tag} is {local} here but {sorted(peeled)} at the remote; refusing to "
                      "measure a baseline against a tag whose identity is not settled"
                  )
          
          
          def surface_of_tree(root: Path, tree_root: Path) -> list[str]:
              """Run this repository's extractor against a recovered tree."""
              script = Path(__file__).resolve().parent / SURFACE_SCRIPT
              if not script.is_file():
                  raise BaselineError(f"{script} is missing; there is no extractor to recover a surface with")
              result = subprocess.run(
                  [sys.executable, str(script), "--root", str(tree_root)],
                  capture_output=True,
                  text=True,
              )
              if result.returncode != ZERO:
                  raise BaselineError(f"{SURFACE_SCRIPT} refused to read {tree_root}: {result.stderr.strip()}")
              payload = json.loads(result.stdout)
              names = payload["surface"]
              if not names:
                  raise BaselineError(f"{SURFACE_SCRIPT} produced an empty surface for {tree_root}")
              return names
          
          
          def surface_at_tag(root: Path, tag: str) -> list[str]:
              assert_tag_agrees_with_remote(root, tag)
              with tempfile.TemporaryDirectory(prefix="autoversion-tag-") as scratch:
                  archive = subprocess.run(
                      ["git", "-C", str(root), "archive", "--format=tar", tag],
                      capture_output=True,
                  )
                  if archive.returncode != ZERO:
                      raise BaselineError(
                          f"git archive {tag} failed: {archive.stderr.decode('utf-8', 'replace').strip()}. "
                          "On a runner this is usually a shallow clone: the tag is visible but its tree "
                          "was never fetched, so unshallow before generating a baseline."
                      )
                  extract = subprocess.run(["tar", "-x", "-C", scratch], input=archive.stdout, capture_output=True)
                  if extract.returncode != ZERO:
                      raise BaselineError(f"unpacking the {tag} archive failed: {extract.stderr.decode('utf-8', 'replace')}")
                  return surface_of_tree(root, Path(scratch))
          
          
          def assert_publishes_nothing(root: Path) -> None:
              """The ground for not consulting a release channel, re-read every run."""
              workflows = root / ".github" / "workflows"
              present = {path.name for path in workflows.iterdir()} if workflows.is_dir() else set()
              unexpected = present - EXPECTED_WORKFLOWS
              if unexpected:
                  raise BaselineError(
                      f"this tree now carries {sorted(unexpected)}. The tier ladder here skips the "
                      "release channel because nothing in this repository publishes; a new workflow "
                      "may have changed that, so re-decide the ladder rather than trusting this one."
                  )
          
          
          def build(root: Path) -> dict:
              assert_publishes_nothing(root)
              slug = repo_slug(root)
              assert_probe_can_see_this_repository(slug, root)
              releases = published_release_tags(slug)
              tags = remote_tags(root)
          
              release_tag = newest(releases)
              if release_tag is not None:
                  return {
                      "version": release_tag.lstrip("v"),
                      "source": (
                          f"{MARKER_GH_RELEASE}:{release_tag} surface read statically from the tag's tree; "
                          f"the published release for {slug} is what consumers resolve"
                      ),
                      "surface": surface_at_tag(root, release_tag),
                  }
          
              tag = newest(tags)
              if tag is not None:
                  return {
                      "version": tag.lstrip("v"),
                      "source": (
                          f"{MARKER_GIT_ARCHIVE}:{tag} no GitHub Release is published, established by "
                          f"reading the releases API's answer for {slug}; SwiftPM resolves this package "
                          "by tag, and sibling Package.resolved files pin this version"
                      ),
                      "surface": surface_at_tag(root, tag),
                  }
          
              sha = run(["git", "-C", str(root), "rev-parse", "HEAD"]).strip()
              return {
                  "version": FLOOR_VERSION,
                  "source": (
                      f"{MARKER_HEAD}:{sha} neither a published release nor a tag exists at the remote, "
                      "so nothing has been released and there is no artifact above the working revision"
                  ),
                  "surface": surface_of_tree(root, root),
              }
          
          
          def main() -> int:
              parser = argparse.ArgumentParser(description="generate the released-surface baseline")
              parser.add_argument("--root", default=".", help="package root")
              parser.add_argument(
                  "--stdout",
                  action="store_true",
                  help="print the candidate baseline instead of writing it; the gate must never rewrite the committed file",
              )
              parser.add_argument(
                  "--rule-url",
                  action="store_true",
                  help="print the pinned install coordinate of the shared rule and exit",
              )
              args = parser.parse_args()
              if args.rule_url:
                  print(RULE_URL)
                  return ZERO
              root = Path(args.root).resolve()
              try:
                  document = build(root)
              except BaselineError as exc:
                  print(f"baseline.py: {exc}", file=sys.stderr)
                  return ONE
              text = json.dumps(document, indent=len("  "), sort_keys=True) + "\n"
              if args.stdout:
                  sys.stdout.write(text)
              else:
                  (root / RELEASED_SURFACE).write_text(text, encoding="utf-8")
                  print(f"wrote {RELEASED_SURFACE}: {document['source'].split()[ZERO]}", file=sys.stderr)
              return ZERO
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Install the shared rule
        # Never `pip install` into the system interpreter. `ubuntu-latest` resolves to an
        # Ubuntu whose python3 carries the externally-managed marker, so that spelling
        # dies with `error: externally-managed-environment` before any check runs -- a
        # permanently red gate, which by this fleet's own standard is worth exactly what
        # a sleeping one is worth and trains people to ignore a red build. Invisible from
        # a laptop, and invisible here too while Actions is billing-locked, because this
        # step has never once run on a runner.
        #
        # A venv sidesteps the marker without --break-system-packages, and appending its
        # bin to GITHUB_PATH leaves every later `autoversion` call spelled exactly as it
        # was. RUNNER_TEMP and GITHUB_PATH exist only on a runner, hence the defaults --
        # which are also what let this body be extracted and run locally, the only
        # technique available here that can falsify a claim about CI.
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          : "${GITHUB_PATH:=$(mktemp)}"
          python3 -m venv "$RUNNER_TEMP/rule"
          # The coordinate is pinned; the inline baseline generator owns the tag as a constant,
          # because this workspace refuses digits inside a `.yml`.
          "$RUNNER_TEMP/rule/bin/python" -m pip install --quiet \
            "$(python3 "$RUNNER_TEMP/version-check/baseline.py" --rule-url)"
          echo "$RUNNER_TEMP/rule/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH takes effect on the NEXT step only, so without this export the
          # assertion below would consult whatever `autoversion` was already on PATH --
          # including a stranger's, which would exit zero and vouch for a rule nobody
          # asked. Prepending after the install is what makes the venv win, and it is
          # load-bearing separately from the GITHUB_PATH line.
          export PATH="$RUNNER_TEMP/rule/bin:$PATH"

          # Which `autoversion` is about to answer? Establish that BEFORE asking it
          # anything. `--help` is satisfied by any executable that exits zero, so a
          # stranger earlier on PATH passes a liveness probe and then supplies every
          # verdict below -- and if the export above is ever dropped in an edit, the
          # symptom is a green step rather than a red one. Naming the resolved path is
          # what makes that failure visible instead of invisible.
          resolved="$(command -v autoversion || true)"
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${resolved:-nothing}', outside the" \
                "venv this step just built, so a stranger would answer for the rule and" \
                "every verdict below would be its word rather than the rule's."
              false
              ;;
          esac

          # Then two DIFFERENT known answers, because one cannot be enough: a saboteur
          # that always says `internal` passes a single-answer probe AND the gate's own
          # steps, since with no new tag on this revision `internal` IS the passing
          # branch. Identical surfaces must read `internal`; a surface with one name
          # removed must read `breaking`. That second arm is the only thing here that
          # requires the gate to be ABLE TO REFUSE.
          #
          # Both sides are built from the COMMITTED baseline rather than a synthetic
          # pair, so this same step also proves the frozen file parses and that it is
          # the file reaching the decision. The name is dropped without a bare index,
          # which this workspace refuses. An empty candidate would be no use as the
          # breaking case -- the rule rejects it outright as a far more likely broken
          # extractor.
          shrunk="$RUNNER_TEMP/shrunk.json"
          jq '{surface: (.surface - [(.surface | sort | first)])}' \
            released-surface.json > "$shrunk"
          current="$(jq -r .version released-surface.json)"
          unchanged="$(autoversion decide --current "$current" \
            --published-surface released-surface.json \
            --candidate-surface released-surface.json --json | jq -r .change)"
          removed="$(autoversion decide --current "$current" \
            --published-surface released-surface.json \
            --candidate-surface "$shrunk" --json | jq -r .change)"
          if [ "$unchanged" != internal ] || [ "$removed" != breaking ]; then
            echo "::error::the rule does not answer as the rule: the committed surface" \
              "against itself read '$unchanged', and with one name removed it read" \
              "'$removed'. Something other than AutoVersion is answering, so no verdict" \
              "below means anything."
            false
          fi

      - name: Read the public surface
        # No build, no `swift package resolve`, no import: the inline public-surface extractor
        # reads Sources/WisentAuth statically, so the surface cannot become a
        # property of a toolchain version or of a resolved dependency graph. A
        # file that will not scan fails the step instead of shrinking the
        # surface, because a shrink reads as a breaking removal that never
        # happened.
        run: python3 "$RUNNER_TEMP/version-check/surface.py" > "$RUNNER_TEMP/candidate.json"

      - name: Prove this gate can still refuse
        run: |
          set -euo pipefail
          # A gate that has never refused is decoration, and the install step's
          # two-answer probe does not retire this one. That probe ran under its
          # own in-step `export PATH`, pointed at the venv it had just built.
          # Every step from here down resolves `autoversion` through
          # GITHUB_PATH instead, which is a DIFFERENT resolution and takes
          # effect only from the next step onwards. So the arm that proved the
          # rule can say `breaking` and the arm that consumes the verdict below
          # have never yet been the same binary: drop the GITHUB_PATH line, or
          # let a stranger's `autoversion` sit earlier on the runner's PATH, and
          # the install step stays green while every verdict after it comes from
          # somebody else. And a stranger answering a constant `internal` is
          # invisible to the comparison below, because with no new tag on this
          # revision `internal` IS the passing branch.
          #
          # This step closes that gap by demanding a refusal from whatever
          # answers HERE, one step before the verdict is consumed and through the
          # same PATH that consumes it. It is not the install probe repeated; it
          # is that probe carried across the step boundary the install step
          # cannot cross.
          #
          # Built from the COMMITTED baseline rather than a synthetic pair, so it
          # also proves the frozen file parses and is really what reaches the
          # decision. `- [first]` drops one name without a bare subscript, which
          # this workspace refuses to let anyone write. One name, never all of
          # them: the rule rejects an empty candidate outright as a far more
          # likely broken extractor, so an empty surface is no use as the
          # breaking case.
          released="$(jq -r .version released-surface.json)"
          jq '{surface: (.surface - [(.surface | sort | first)])}' \
            released-surface.json > "$RUNNER_TEMP/refusal-probe.json"
          dropped="$(jq -r '.surface | sort | first' released-surface.json)"
          verdict="$(autoversion decide --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/refusal-probe.json" --json \
            | jq -r .change)"
          if [ "$verdict" != breaking ]; then
            echo "::error::removing $dropped from the released contract of" \
              "$released yielded '${verdict:-<nothing>}' instead of breaking," \
              "answered by the \`autoversion\` at" \
              "'$(command -v autoversion || echo nothing)'. This gate cannot" \
              "refuse a removal, so the comparison below can only ever pass and" \
              "its pass is worthless. Fix the check; do not trust it."
            false
          fi
          echo "Dropping $dropped is refused as breaking, so this gate can refuse."

      - name: Compare against the released contract
        run: |
          set -euo pipefail
          released="$(jq -r .version released-surface.json)"
          # `git tag` runs on its own so `set -e` still sees it fail. The filter
          # runs in its own pipeline with `|| true` because "no tag points at
          # this revision" is the ordinary case and grep reports it by exiting
          # non-zero, which under `pipefail` would kill the step before either
          # arm below ran. Found by running this step body inside a shallow,
          # tag-less clone -- the shape a runner checks out. It died right here
          # with no output at all, and was invisible in the tree this package is
          # developed in, which always had a tag on HEAD.
          tags_here="$(git tag --points-at HEAD)"
          declared="$(printf '%s\n' "$tags_here" \
            | grep -E '^v?[[:digit:]]+(\.[[:digit:]]+)*$' \
            | sort -V | sed -n '$p' || true)"

          verdict="$(autoversion decide \
            --current "$released" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/candidate.json" \
            --json)"
          echo "$verdict"

          change="$(printf '%s' "$verdict" | jq -r .change)"
          required="$(printf '%s' "$verdict" | jq -r .next)"
          echo "released: $released"
          echo "declared: ${declared:-<no version tag points at HEAD>}"

          if [ -z "$declared" ] || [ "${declared#v}" = "$released" ]; then
            # This revision claims no new version. A consumer resolving `from:`
            # therefore still gets $released, so that claim is only honest while
            # the API is unchanged.
            if [ "$change" != internal ]; then
              echo "::error::WisentAuth's public API changed ($change) but no tag above" \
                "$released points at this revision, so every sibling package resolving" \
                "a \`from:\` requirement keeps getting $released while its surface has" \
                "moved. The next tag must be $required. This check does not create it."
              false
            fi
            echo "No new tag, and the API is unchanged since $released."
          elif [ "${declared#v}" != "$required" ]; then
            echo "::error::tag $declared points at this revision, but a $change change" \
              "to $released requires $required."
            false
          else
            echo "Tag $declared matches the $change change."
          fi

      - name: Refuse a baseline that misstates where it came from
        run: |
          set -euo pipefail
          # The marker is the first whitespace-delimited token of "source", and
          # the inline baseline generator writes it, so the two files agree through a
          # constant rather than through prose that drifts. `first`, never a bare
          # subscript: this workspace refuses bare numeric literals.
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          released="$(jq -r .version released-surface.json)"
          # An empty or null marker must never reach the comparison below: it
          # would be compared against an equally empty candidate and pass
          # vacuously, which is the one outcome a frozen file exists to prevent.
          case "${marker:-}" in
            ''|null)
              echo "::error::released-surface.json yielded no marker. The file is" \
                "malformed or .source is missing, so nothing here can be checked."
              false ;;
          esac
          tier="${marker%%:*}"
          named="${marker#*:}"
          echo "marker: $marker"

          # Read the *content* of each answer, never a client's exit status.
          # `git ls-remote` failing on no egress and a repository genuinely
          # holding no tags are indistinguishable by exit code, and the wrong
          # reading is the passing one. Likewise the package-release count is
          # asked as a word -- some, none, or empty for "did not answer" -- so
          # silence can never be read as absence. Non-version releases document
          # other contracts and cannot supersede a SwiftPM package tag.
          remote_tags="$(git ls-remote --tags origin || true)"
          any_entries='if (length > ([] | length)) then "some" else "none" end'
          version_entries='[.[] | select(.draft | not) | .tag_name | select(test("^v?[[:digit:]]+(\\.[[:digit:]]+)*$"))] | if (length > ([] | length)) then "some" else "none" end'
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "$version_entries" || true)"

          # Fail-closed twin, pointed at the positive branch, on a subject THIS
          # job's own credential can reach. "Unproven" is also what a broken
          # expression produces, so this step must prove it can still recognise a
          # fact that certainly holds.
          #
          # The first spelling asked whether it could see wisent-ai/oko's
          # releases. Same organisation, same private visibility, same endpoint --
          # and unreachable: a runner's `secrets.GITHUB_TOKEN` is scoped to the
          # repository running the job, so a private foreign repository answers
          # `Not Found` exactly like an absence and the control refuses on every
          # single run. Measured: repos/wisent-ai/oko is private, and
          # unauthenticated -- which is what a foreign-scoped token amounts to --
          # its releases read "Not Found". That is a permanently red gate, worth
          # exactly what a sleeping one is worth. A control that needs wider
          # access than the subject is not a control; it is a second subject.
          #
          # This repository serves no versioned package releases at all -- that
          # is precisely why its tier is a tag -- so it cannot control the
          # package-release probe on itself.
          # What it can demand is everything that probe depends on and shares: the
          # same host, the same client, the same credential, the same jq spelling,
          # under this repository's own slug. Two demands, and each catches what
          # the other cannot:
          #
          #   the API must name THIS repository back -- a permission refusal, a
          #   rate-limit page or an expired token cannot fake `full_name`, and
          #   asking about our own slug cannot be a wrong subject;
          #
          #   while the remote holds tags, the API's LIST endpoint must show some
          #   too -- authorised silence on our own slug yields an empty list from
          #   the API while `git ls-remote` still lists eight, and that
          #   disagreement between two transports is exactly the state a control
          #   exists to catch. It also covers the list handling the releases probe
          #   uses, which naming alone would not.
          named_back="$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name || true)"
          if [ "$named_back" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::the API did not name $GITHUB_REPOSITORY back (it answered" \
              "'${named_back:-<nothing>}'), so this step cannot read its own repository" \
              "and every absence below is unproven. Fix the check; do not trust it."
            false
          fi
          api_tags="$(gh api "repos/$GITHUB_REPOSITORY/tags" --jq "$any_entries" || true)"
          if printf '%s' "$remote_tags" | grep -q 'refs/tags/' \
             && [ "$api_tags" != some ]; then
            echo "::error::git lists tags for $GITHUB_REPOSITORY but the API answered" \
              "'${api_tags:-<nothing>}' about them, so its list endpoint is silent about a" \
              "fact that certainly holds and no verdict below means anything."
            false
          fi

          case "$tier" in
            gh-release)
              # Forward: the marker claims a published release, so that release
              # must really be served.
              gh release view "$named" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null || {
                echo "::error::released-surface.json was recovered from release $named," \
                  "which this repository does not serve. Run the inline baseline generator."; false; }
              echo "Release $named is served."
              ;;
            git-archive)
              # Forward: the tag must exist at the remote, and its tree must be
              # present -- a shallow clone shows a tag it cannot archive.
              printf '%s' "$remote_tags" | grep -q "refs/tags/$named\$" || {
                echo "::error::released-surface.json was recovered from tag $named, which" \
                  "the remote does not serve. Either the tag is gone or this step read an" \
                  "empty answer from a request that failed; both mean the baseline is" \
                  "unproven, which is not the same as fine."; false; }
              git rev-parse "$named^{tree}" >/dev/null || {
                echo "::error::tag $named is visible but its tree is absent, so the" \
                  "baseline cannot be regenerated. Unshallow the checkout."; false; }
              # Reverse: this tier claims no GitHub Release exists. If one does,
              # the baseline is dodging a real published artifact.
              if [ -z "$releases" ]; then
                echo "::error::the releases API did not answer, so the absence of a" \
                  "published release is unproven and this tier cannot be trusted."
                false
              fi
              if [ "$releases" != none ]; then
                echo "::error::marker $marker claims no release is published, but" \
                  "$GITHUB_REPOSITORY serves at least one. The baseline must be" \
                  "recovered from the release. Run the inline baseline generator."
                false
              fi
              echo "Tag $named is served, and no GitHub Release supersedes it."
              ;;
            head)
              # Reverse: this tier claims nothing was ever published, so neither a
              # tag nor a release may exist.
              if printf '%s' "$remote_tags" | grep -q 'refs/tags/'; then
                echo "::error::marker $marker claims nothing is released, but the remote" \
                  "serves tags. SwiftPM resolves those, so one of them is the baseline."
                false
              fi
              if [ "$releases" != none ]; then
                echo "::error::marker $marker claims nothing is released, but the releases" \
                  "API answered '${releases:-<nothing>}'. Run the inline baseline generator."
                false
              fi
              echo "Neither a tag nor a release exists; head is the honest tier."
              ;;
            *)
              echo "::error::unknown baseline marker: $marker. the inline baseline generator emits" \
                "gh-release, git-archive or head; anything else means the file was" \
                "hand-edited, and a person decides rather than this gate accepting a" \
                "baseline it cannot check."
              false
              ;;
          esac

          # Being honest about the tier is not being on the best one. A tag or a
          # release can appear after the baseline was frozen, leaving the marker
          # truthful and the baseline stale while the gate measures a superseded
          # artifact. Only the marker is regenerated here: the committed surface
          # stays the only surface any decision sees, because recomputing both
          # sides at check time is the one shape that structurally cannot refuse.
          # Do NOT write this as `best="$(generator | jq ...)"`. In a command
          # substitution the generator's exit status is discarded and `set -e`
          # does not intervene, so a generator that died produces an empty
          # `best` -- which either refuses while blaming the wrong thing or, if
          # the committed marker also reads empty, compares "" against "" and
          # passes vacuously. Run it into a file, test the status, then demand a
          # non-empty answer. (Found by EveToolkit in this same wave, on a gate
          # of exactly this shape.)
          if ! python3 "$RUNNER_TEMP/version-check/baseline.py" --stdout > "$RUNNER_TEMP/best.json"; then
            echo "::error::the inline baseline generator could not establish the best reachable" \
              "artifact, so whether this baseline is stale is unproven. That is not" \
              "the same as up to date."
            false
          fi
          best="$(jq -r '.source | split(" ") | first' "$RUNNER_TEMP/best.json")"
          case "${best:-}" in
            ''|null)
              echo "::error::the regenerated baseline yielded no marker, so the" \
                "staleness comparison has nothing to compare. Fix the generator."
              false ;;
          esac
          if [ "$tier" = head ]; then
            want="${best%%:*}"; have="$tier"
          else
            want="$best"; have="$marker"
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::the baseline is '$have' but '$want' is reachable now." \
              "Run the inline baseline generator."
            false
          fi
          echo "Baseline $released at '$marker' is still the best reachable artifact."
